name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> $GITHUB_ENV

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.PACKAGE_VERSION}`,
              name: `Release v${process.env.PACKAGE_VERSION}: Complete feature set with WebGL rendering, spatial indexing, and multi-platform support`,
              body: `## 📦 Installation

Download the appropriate installer for your platform below.

### Windows
- **NSIS Installer** (Recommended): \`Annotate-Studio_${process.env.PACKAGE_VERSION}_x64-setup.exe\`
- **MSI Installer**: \`Annotate-Studio_${process.env.PACKAGE_VERSION}_x64_en-US.msi\`

### macOS
- **Apple Silicon** (M1/M2/M3): \`Annotate-Studio_${process.env.PACKAGE_VERSION}_aarch64.dmg\`
- **Intel**: \`Annotate-Studio_${process.env.PACKAGE_VERSION}_x64.dmg\`

### Linux
- **Debian/Ubuntu**: \`annotate-studio_${process.env.PACKAGE_VERSION}_amd64.deb\`
- **Fedora/RHEL**: \`annotate-studio-${process.env.PACKAGE_VERSION}-1.x86_64.rpm\`
- **AppImage** (Universal): \`annotate-studio_${process.env.PACKAGE_VERSION}_amd64.AppImage\`

---

## ✨ Features

- **WebGL Rendering** - Hardware-accelerated graphics with 60+ FPS
- **Professional Tools** - Pen, highlighter, eraser, shapes, and text
- **Spatial Indexing** - QuadTree-based hit detection for instant selection
- **Multi-Platform** - Native apps for Windows, macOS, and Linux
- **Export Workflows** - Save as PDF with annotations or project files

---

**Full Changelog:** https://github.com/${context.repo.owner}/${context.repo.repo}/commits/v${process.env.PACKAGE_VERSION}`,
              draft: false,
              prerelease: false
            })
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
            arch: 'aarch64'
            
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
            arch: 'x64'
            
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'
            arch: 'amd64'
            
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
            arch: 'x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev rpm

      - name: Install frontend dependencies
        run: |
          cd src
          npm ci

      - name: Build WASM
        run: |
          cd src
          npm run build:wasm

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          projectPath: src-tauri

  publish-release:
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              prerelease: false
            })

